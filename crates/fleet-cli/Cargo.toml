[package]
name = "fleet-cli"
description = "Command-line interface for Grok Fleet Orchestrator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["acp"]
# ACP transport — `--transport acp` 모드 활성화 (grok agent serve와 통신).
# 기본 켜짐; rustls을 빼서 바이너리를 줄이려면 `--no-default-features` 사용.
# `dep:rustls`: main()에서 rustls CryptoProvider를 명시적으로 설치하기 위한
# 직접 의존성 — wss:// AcpTransport 접속이 컴파일되는 빌드에서만 필요.
acp = ["fleet-transport/acp", "dep:rustls"]
# mTLS: 사설 CA + 클라이언트 인증서 기반 orchestrator↔worker TLS 보호.
# `fleet mtls` 서브커맨드와 `--mtls-ca/--mtls-cert/--mtls-key` 플래그 활성화.
mtls = ["fleet-transport/mtls", "dep:rcgen", "dep:rustls"]

[[bin]]
name = "fleet"
path = "src/main.rs"

# ─── cargo-binstall 메타데이터 ─────────────────────────────────────────
# `cargo binstall --git <repo> fleet-cli` 로 미리 빌드된 `fleet` 바이너리를
# 설치. tarball 은 release.yml 에서 생성되며 동일 아카이브에 `fleet-worker`
# 바이너리도 함께 포함되어 있다 (fleet-worker 패키지 메타데이터 참조).
#
# 템플릿 변수:
#   { repo }    = workspace.package.repository
#   { version } = Cargo.toml version (v 접두사 없음)
#   { target }  = rustc target triple (예: x86_64-unknown-linux-gnu)
#   { bin }     = `[[bin]] name` (위에서 "fleet")
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/fleet-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }"
pkg-fmt = "tgz"

[dependencies]
fleet-core = { workspace = true }
fleet-credentials = { workspace = true }
fleet-store = { workspace = true }
fleet-transport = { workspace = true }
fleet-scheduler = { workspace = true }
fleet-mcp = { workspace = true }
fleet-api = { workspace = true }
fleet-provisioner = { workspace = true }
fleet-dashboard = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# users 하위 명령 — 비밀번호 안전 입력 + 강도 검증 (Phase 9.1.6)
rpassword = "7"
zxcvbn = { workspace = true }

# mTLS-only (optional; Phase 8.5)
rcgen = { workspace = true, optional = true, features = ["pem", "x509-parser"] }
time = "0.3"

# main()에서 CryptoProvider::install_default()를 명시 호출하기 위한 직접 의존성
# (acp/mtls 피처에서만 활성 — dep:rustls 참조).
rustls = { workspace = true, optional = true }
# mTLS 워커 프로비저닝(로드맵 #85)에서 issue-server 결과물을 담을 임시
# 디렉토리 — Drop에서 자동 정리되어 발급된 개인키가 /tmp에 남지 않는다.
# mtls.rs 테스트도 이미 썼던 크레이트라 dev-dependencies에서 승격.
tempfile = "3"

[dev-dependencies]
# rustls-pemfile 단위 테스트용 (mtls feature 켜진 빌드에서만 사용).
rustls-pemfile = { workspace = true }
rustls = { workspace = true }
