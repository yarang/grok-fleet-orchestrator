[package]
name = "fleet-store"
description = "Store trait and PostgreSQL implementation for Grok Fleet Orchestrator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fleet-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
fleet-core = { workspace = true }
# 자기 자신을 dev-dependency로 다시 거는 것은 `test-support`를 통합
# 테스트에서만 켜기 위해서다. `tests/agent_templates.rs`가 MemStore와
# PgStore에 **같은 시나리오**를 걸어야 하는데(설계 게이트 8), `mem` 모듈은
# 그 피처 뒤에 있고 통합 테스트는 lib의 피처를 자동으로 켜지 않는다.
# 프로덕션 빌드에는 영향이 없다 — dev-dependency는 릴리즈 그래프에 들어가지
# 않는다.
fleet-store = { path = ".", features = ["test-support"] }

[features]
# 테스트 전용 완전 인메모리 Store 구현(`mem::MemStore`)을 노출한다. 로드맵
# #45 — fleet-api/fleet-dashboard/fleet-scheduler가 각자 정의하던 10개의
# 중복 MemStore를 이 하나로 통합하기 위한 피처. 프로덕션 빌드에는 이 피처를
# 켜지 않으므로 릴리즈 바이너리에 포함되지 않는다.
test-support = []
