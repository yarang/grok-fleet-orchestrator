<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — Fleet</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- sidebar:start -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>Fleet</h1>
      <div id="status-pill">connecting…</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-group">
      <a href="/" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Overview</span></a>
      <a href="/tasks" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1.5 1.5L8 5"/><path d="M4 12l1.5 1.5L8 11"/><path d="M4 18l1.5 1.5L8 17"/></svg><span>Tasks</span></a>
      <a href="/hosts" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r="0.8" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg><span>Hosts</span></a>
      </div>
      <div class="sidebar-group">
        <p class="sidebar-group-label">Admin</p>
      <a href="/hosts/provision" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Provision</span></a>
      <a href="/admin/ssh-keys" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg><span>SSH Keys</span></a>
      <a href="/admin/users" class="sidebar-link active" aria-current="page"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg><span>Users</span></a>
      <a href="/admin/activity" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2 7 4-14 2 7h6"/></svg><span>Activity</span></a>
      <a href="/admin/tools" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 005.4-5.4l-2.5 2.5-2-2 2.5-2.5z"/></svg><span>Tools</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebar-user-menu"></div>
    </div>
  </aside>
  <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <!-- sidebar:end -->

  <main>
    <h1 class="page-title">User Management</h1>
    <p class="page-subtitle">Manage dashboard users and their roles.</p>

    <div id="create-panel" class="panel" style="margin-bottom:24px;display:none;">
      <h3 style="margin:0 0 12px;font-size:15px;">Create New User</h3>
      <form id="create-form" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
        <label>Email
          <input name="email" type="email" required placeholder="user@example.com" style="display:block;margin-top:4px;" />
        </label>
        <label>Display Name (optional)
          <input name="username" type="text" placeholder="auto from email" style="display:block;margin-top:4px;" />
        </label>
        <label>Password
          <input name="password" type="password" required minlength="8" placeholder="••••••••" style="display:block;margin-top:4px;" />
        </label>
        <button type="submit" class="btn btn-primary">Create</button>
        <button type="button" class="btn" onclick="document.getElementById('create-panel').style.display='none';">Cancel</button>
      </form>
      <p id="create-msg" style="margin:8px 0 0;font-size:13px;color:var(--badge-failed,#c0392b);display:none;"></p>
    </div>

    <div style="margin-bottom:12px;">
      <button id="show-create-btn" class="btn btn-primary" onclick="document.getElementById('create-panel').style.display='block';this.style.display='none';">+ Add User</button>
    </div>

    <div id="user-table" class="table">
      <div class="row header">
        <div>Username</div><div>Email</div><div>Roles</div><div>Enabled</div><div>Last Login</div><div>Actions</div>
      </div>
    </div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <h3>No users found</h3>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    async function fetchUsers() {
      try {
        const resp = await fetch('/api/users');
        const users = await resp.json();
        render(users);
      } catch(e) { console.error('fetch users:', e); }
    }

    function fmtTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    let _users = [];
    let _canCreate = false;
    let _canDelete = false;

    function getCsrf() {
      const m = document.cookie.match('(^|;)\\s*fleet_csrf\\s*=\\s*([^;]+)');
      return m ? m.pop() : '';
    }

    async function checkPerms() {
      try {
        const resp = await fetch('/api/me');
        const me = await resp.json();
        _canCreate = (me.permissions||[]).includes('user:create');
        _canDelete = (me.permissions||[]).includes('user:delete');
        if (_canCreate) {
          document.getElementById('show-create-btn').style.display = '';
        } else {
          document.getElementById('show-create-btn').style.display = 'none';
        }
      } catch(e) { console.error('checkPerms', e); }
    }

    function render(users) {
      _users = users || [];
      const table = document.getElementById('user-table');
      const empty = document.getElementById('empty-state');

      table.querySelectorAll('.row:not(.header)').forEach(r => r.remove());

      if (!users || users.length === 0) {
        empty.style.display = 'block';
        table.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      table.style.display = 'grid';

      for (const u of users) {
        const row = document.createElement('div');
        row.className = 'row';

        let actions = '';
        if (_canCreate) {
          actions += `<button class="btn btn-sm" onclick="toggleUser('${u.id}','${u.enabled}')">${u.enabled ? 'Disable' : 'Enable'}</button> `;
        }
        if (_canDelete) {
          actions += `<button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}','${escapeHtml(u.username)}')">Delete</button>`;
        }
        if (!actions) actions = '<span style="font-size:12px;color:var(--ink-muted-48);">—</span>';

        row.innerHTML = `
          <div style="font-weight:600;">${escapeHtml(u.username)}</div>
          <div style="font-size:13px;color:var(--ink-muted-48);">${escapeHtml(u.email||'—')}</div>
          <div>${(u.roles||[]).map(r=>'<span class="badge badge-provisioned">'+escapeHtml(r)+'</span>').join(' ')||'—'}</div>
          <div>${u.enabled ? '<span class="badge badge-online">enabled</span>' : '<span class="badge badge-failed">disabled</span>'}</div>
          <div style="font-size:13px;color:var(--ink-muted-48);">${fmtTime(u.last_login_at)}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;">${actions}</div>
        `;
        table.appendChild(row);
      }
    }

    async function toggleUser(id, currentEnabled) {
      const body = new URLSearchParams({ csrf_token: getCsrf() });
      try {
        const resp = await fetch('/api/users/'+id+'/toggle', { method:'POST', body, headers:{'Content-Type':'application/x-www-form-urlencoded'} });
        if (!resp.ok) { const t = await resp.text(); alert('Failed: ' + t); return; }
        fetchUsers();
      } catch(e) { alert('Error: ' + e.message); }
    }

    async function deleteUser(id, username) {
      if (!confirm('Delete user "' + username + '"? This cannot be undone.')) return;
      const body = new URLSearchParams({ csrf_token: getCsrf() });
      try {
        const resp = await fetch('/api/users/'+id+'/delete', { method:'POST', body, headers:{'Content-Type':'application/x-www-form-urlencoded'} });
        if (!resp.ok) { const t = await resp.text(); alert('Failed: ' + t); return; }
        fetchUsers();
      } catch(e) { alert('Error: ' + e.message); }
    }

    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = new URLSearchParams(new FormData(form));
      data.set('csrf_token', getCsrf());
      const msg = document.getElementById('create-msg');
      msg.style.display = 'none';
      try {
        const resp = await fetch('/api/users', { method:'POST', body:data, headers:{'Content-Type':'application/x-www-form-urlencoded'} });
        if (resp.ok) {
          form.reset();
          document.getElementById('create-panel').style.display = 'none';
          document.getElementById('show-create-btn').style.display = '';
          fetchUsers();
        } else {
          const t = await resp.text();
          msg.textContent = 'Error: ' + t;
          msg.style.display = 'block';
        }
      } catch(e) {
        msg.textContent = 'Error: ' + e.message;
        msg.style.display = 'block';
      }
    });

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // 권한 확인 후 사용자 목록 로드.
    document.getElementById('show-create-btn').style.display = 'none';
    checkPerms().then(() => fetchUsers());

    // SSE
    const pill = document.getElementById('status-pill');
    try {
      const es = new EventSource('/api/events/stream');
      es.onopen = () => { pill.textContent = 'live'; pill.classList.add('online'); };
      es.onerror = () => { pill.textContent = 'offline'; pill.classList.remove('online'); };
    } catch(e) {}

  </script>
</body>
</html>
