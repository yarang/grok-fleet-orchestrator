<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks — Fleet</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- sidebar:start -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>Fleet</h1>
      <div id="status-pill">connecting…</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-group">
      <a href="/" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Overview</span></a>
      <a href="/tasks" class="sidebar-link active" aria-current="page"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1.5 1.5L8 5"/><path d="M4 12l1.5 1.5L8 11"/><path d="M4 18l1.5 1.5L8 17"/></svg><span>Tasks</span></a>
      <a href="/hosts" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r="0.8" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg><span>Hosts</span></a>
      </div>
      <div class="sidebar-group">
        <p class="sidebar-group-label">Admin</p>
      <a href="/hosts/provision" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Provision</span></a>
      <a href="/admin/ssh-keys" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg><span>SSH Keys</span></a>
      <a href="/admin/users" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg><span>Users</span></a>
      <a href="/admin/activity" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2 7 4-14 2 7h6"/></svg><span>Activity</span></a>
      <a href="/admin/tools" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 005.4-5.4l-2.5 2.5-2-2 2.5-2.5z"/></svg><span>Tools</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebar-user-menu"></div>
    </div>
  </aside>
  <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <!-- sidebar:end -->

  <main>
    <h1 class="page-title">Task Queue</h1>
    <p class="page-subtitle">All tasks across the fleet, newest first.</p>

    <div class="filter-bar">
      <div class="pill-group">
        <button class="pill-btn active" data-filter="all">All</button>
        <button class="pill-btn" data-filter="pending">Pending</button>
        <button class="pill-btn" data-filter="dispatched">Running</button>
        <button class="pill-btn" data-filter="completed">Completed</button>
        <button class="pill-btn" data-filter="failed">Failed</button>
      </div>
    </div>

    <div id="task-table" class="table">
      <div class="row header">
        <div>ID</div><div>Phase</div><div>Prompt</div><div>Model</div><div>Worker</div><div>Tokens</div><div>Duration</div><div>Created</div>
      </div>
    </div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <h3>No tasks found</h3>
      <p>Tasks will appear here when submitted via MCP or API.</p>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    let allTasks = [];
    let currentFilter = 'all';

    async function fetchTasks() {
      try {
        const resp = await fetch('/api/tasks?limit=200');
        allTasks = await resp.json();
        render();
      } catch (e) { console.error('fetch tasks:', e); }
    }

    function fmtTokens(t) {
      if (!t) return '—';
      const total = t.total_tokens || 0;
      if (total >= 1e6) return (total/1e6).toFixed(1)+'M';
      if (total >= 1e3) return (total/1e3).toFixed(1)+'k';
      return total;
    }

    function fmtDuration(secs) {
      if (!secs) return '—';
      if (secs < 60) return secs.toFixed(1)+'s';
      if (secs < 3600) return (secs/60).toFixed(1)+'m';
      return (secs/3600).toFixed(1)+'h';
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return Math.floor(diff)+'s ago';
      if (diff < 3600) return Math.floor(diff/60)+'m ago';
      if (diff < 86400) return Math.floor(diff/3600)+'h ago';
      return d.toLocaleDateString();
    }

    function render() {
      const filtered = currentFilter === 'all'
        ? allTasks
        : allTasks.filter(t => t.phase === currentFilter);

      const table = document.getElementById('task-table');
      const empty = document.getElementById('empty-state');

      // 헤더 제외 기존 행 제거
      table.querySelectorAll('.row:not(.header)').forEach(r => r.remove());

      if (filtered.length === 0) {
        empty.style.display = 'block';
        table.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      table.style.display = 'grid';

      for (const t of filtered) {
        const row = document.createElement('div');
        row.className = 'row';
        row.style.cursor = 'pointer';
        row.onclick = () => window.location.href = '/tasks/' + encodeURIComponent(t.id);
        const prompt = t.prompt.length > 60 ? t.prompt.substring(0,60)+'…' : t.prompt;
        row.innerHTML = `
          <div style="font-family:var(--font-mono);font-size:12px;color:var(--primary);">${t.id.substring(0,8)}</div>
          <div><span class="badge badge-${t.phase}">${t.phase}</span></div>
          <div style="font-size:14px;">${escapeHtml(prompt)}</div>
          <div style="font-size:13px;color:var(--ink-muted-48);">${t.model||'—'}</div>
          <div style="font-family:var(--font-mono);font-size:12px;">${t.worker_id?t.worker_id.substring(0,8):'—'}</div>
          <div style="font-size:13px;">${fmtTokens(t.token_usage)}</div>
          <div style="font-size:13px;">${fmtDuration(t.duration_secs)}</div>
          <div style="font-size:13px;color:var(--ink-muted-48);">${fmtTime(t.created_at)}</div>
        `;
        table.appendChild(row);
      }
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // 필터 버튼 이벤트
    document.querySelectorAll('.pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // 주기적 새로고침
    fetchTasks();
    setInterval(fetchTasks, 5000);

    // SSE 연결 상태
    const pill = document.getElementById('status-pill');
    try {
      const es = new EventSource('/api/events/stream');
      es.onopen = () => { pill.textContent = 'live'; pill.classList.add('online'); };
      es.onerror = () => { pill.textContent = 'offline'; pill.classList.remove('online'); };
      es.addEventListener('task_created', () => fetchTasks());
      es.addEventListener('task_dispatched', () => fetchTasks());
      es.addEventListener('task_completed', () => fetchTasks());
      es.addEventListener('task_failed', () => fetchTasks());
    } catch(e) {}

  </script>
</body>
</html>
