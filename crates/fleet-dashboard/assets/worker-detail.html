<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker Detail — Fleet</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- sidebar:start -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>Fleet</h1>
      <div id="status-pill">connecting…</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-group">
      <a href="/" class="sidebar-link active" aria-current="page"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Overview</span></a>
      <a href="/tasks" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1.5 1.5L8 5"/><path d="M4 12l1.5 1.5L8 11"/><path d="M4 18l1.5 1.5L8 17"/></svg><span>Tasks</span></a>
      <a href="/hosts" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r="0.8" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg><span>Hosts</span></a>
      </div>
      <div class="sidebar-group">
        <p class="sidebar-group-label">Admin</p>
      <a href="/hosts/provision" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Provision</span></a>
      <a href="/admin/ssh-keys" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg><span>SSH Keys</span></a>
      <a href="/admin/users" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg><span>Users</span></a>
      <a href="/admin/activity" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2 7 4-14 2 7h6"/></svg><span>Activity</span></a>
      <a href="/admin/tools" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 005.4-5.4l-2.5 2.5-2-2 2.5-2.5z"/></svg><span>Tools</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebar-user-menu"></div>
    </div>
  </aside>
  <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <!-- sidebar:end -->

  <main>
    <a href="/" class="back-link">← Back to Overview</a>
    <h1 class="page-title" id="worker-name">Loading…</h1>
    <p class="page-subtitle" id="worker-status"></p>

    <div class="detail-grid" id="worker-details"></div>

    <h2 style="font-size:22px;font-weight:600;letter-spacing:-0.265px;margin-top:32px;margin-bottom:12px;">Recent Tasks</h2>
    <div id="task-table" class="table">
      <div class="row header">
        <div>ID</div><div>Phase</div><div>Prompt</div><div>Model</div><div>Tokens</div><div>Duration</div><div>Created</div>
      </div>
    </div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <h3>No tasks</h3>
      <p>This worker has not processed any tasks yet.</p>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script src="/static/worker-detail.js"></script>
</body>
</html>
