<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSH Keys — Fleet</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>Fleet</h1>
    <div id="status-pill">connecting…</div>
    <nav class="nav-links">
      <a href="/">Overview</a>
      <a href="/tasks">Tasks</a>
      <a href="/hosts">Hosts</a>
      <a href="/hosts/provision">Provision</a>
      <a href="/admin/ssh-keys" class="active">SSH Keys</a>
      <a href="/admin/users">Users</a>
      <a href="/admin/activity">Activity</a>
    </nav>
    <span id="user-menu" style="margin-left:auto;"></span>
  </header>

  <main>
    <h1 class="page-title">SSH Key Management</h1>
    <p class="page-subtitle">Encrypted SSH private keys for provisioning remote hosts.</p>

    <div id="upload-panel" class="panel" style="margin-bottom:24px;display:none;">
      <h3 style="margin:0 0 12px;font-size:15px;">Upload SSH Private Key</h3>
      <form id="upload-form" style="display:flex;flex-direction:column;gap:8px;">
        <label>Key Name
          <input name="name" type="text" required placeholder="build-farm-key" style="display:block;margin-top:4px;" />
        </label>
        <label>Private Key (PEM)
          <textarea name="private_key" required rows="8" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;..." style="display:block;margin-top:4px;width:100%;font-family:monospace;font-size:12px;"></textarea>
        </label>
        <div style="display:flex;gap:8px;">
          <button type="submit" class="btn btn-primary">Upload</button>
          <button type="button" class="btn" onclick="document.getElementById('upload-panel').style.display='none';document.getElementById('show-upload-btn').style.display='';">Cancel</button>
        </div>
      </form>
      <p id="upload-msg" style="margin:8px 0 0;font-size:13px;color:var(--badge-failed,#c0392b);display:none;"></p>
    </div>

    <div style="margin-bottom:12px;">
      <button id="show-upload-btn" class="btn btn-primary" onclick="document.getElementById('upload-panel').style.display='block';this.style.display='none';">+ Add Key</button>
    </div>

    <div id="key-table" class="table">
      <div class="row header">
        <div>Name</div><div>Type</div><div>Fingerprint</div><div>Created</div><div>Actions</div>
      </div>
    </div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <h3>No SSH keys uploaded</h3>
      <p style="color:var(--ink-muted-48,#888);font-size:13px;">Upload a private key to provision hosts from the dashboard.</p>
    </div>
  </main>

  <script>
    function getCsrf() {
      const m = document.cookie.match('(^|;)\\s*fleet_csrf\\s*=\\s*([^;]+)');
      return m ? m.pop() : '';
    }

    async function fetchKeys() {
      try {
        const resp = await fetch('/api/ssh-keys');
        if (!resp.ok) { console.error('fetch keys:', resp.status); return; }
        const keys = await resp.json();
        render(keys);
      } catch(e) { console.error('fetch keys:', e); }
    }

    function fmtTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function render(keys) {
      const table = document.getElementById('key-table');
      const empty = document.getElementById('empty-state');
      table.querySelectorAll('.row:not(.header)').forEach(r => r.remove());

      if (!keys || keys.length === 0) {
        empty.style.display = 'block';
        table.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      table.style.display = 'grid';

      for (const k of keys) {
        const row = document.createElement('div');
        row.className = 'row';
        const fp = k.fingerprint.substring(0, 8) + '…' + k.fingerprint.substring(k.fingerprint.length - 8);
        row.innerHTML = `
          <div style="font-weight:600;">${escapeHtml(k.name)}</div>
          <div><span class="badge badge-provisioned">${escapeHtml(k.key_type)}</span></div>
          <div style="font-family:monospace;font-size:12px;color:var(--ink-muted-48,#888);">${fp}</div>
          <div style="font-size:13px;color:var(--ink-muted-48,#888);">${fmtTime(k.created_at)}</div>
          <div><button class="btn btn-sm btn-danger" onclick="deleteKey('${escapeHtml(k.name)}')">Delete</button></div>
        `;
        table.appendChild(row);
      }
    }

    async function deleteKey(name) {
      if (!confirm('Delete SSH key "' + name + '"? This cannot be undone.')) return;
      try {
        const resp = await fetch('/api/ssh-keys/' + encodeURIComponent(name), {
          method: 'DELETE',
          headers: { 'X-CSRF-Token': getCsrf() }
        });
        if (!resp.ok) { const t = await resp.text(); alert('Failed: ' + t); return; }
        fetchKeys();
      } catch(e) { alert('Error: ' + e.message); }
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      const body = { name: fd.get('name'), private_key: fd.get('private_key') };
      const msg = document.getElementById('upload-msg');
      msg.style.display = 'none';
      try {
        const resp = await fetch('/api/ssh-keys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': getCsrf() },
          body: JSON.stringify(body)
        });
        if (resp.ok) {
          form.reset();
          document.getElementById('upload-panel').style.display = 'none';
          document.getElementById('show-upload-btn').style.display = '';
          fetchKeys();
        } else {
          const t = await resp.text();
          msg.textContent = 'Error: ' + t;
          msg.style.display = 'block';
        }
      } catch(e) {
        msg.textContent = 'Error: ' + e.message;
        msg.style.display = 'block';
      }
    });

    document.getElementById('show-upload-btn').style.display = 'none';

    // 권한 확인.
    fetch('/api/me').then(r => r.json()).then(me => {
      if (!(me.permissions||[]).includes('host:provision')) {
        document.getElementById('show-upload-btn').style.display = 'none';
      } else {
        document.getElementById('show-upload-btn').style.display = '';
      }
      document.getElementById('user-menu').innerHTML =
        '<span>' + me.username + '</span> <button onclick="fetch(\'/logout\',{method:\'POST\',headers:{\'X-CSRF-Token\':getCsrf()}}).then(()=>location=\'/login\')" style="background:none;border:none;color:var(--body-muted);font-size:12px;cursor:pointer;margin-left:8px;">Logout</button>';
    }).catch(()=>{});

    fetchKeys();

    // SSE
    const pill = document.getElementById('status-pill');
    try {
      const es = new EventSource('/api/events/stream');
      es.onopen = () => { pill.textContent = 'live'; pill.classList.add('online'); };
      es.onerror = () => { pill.textContent = 'offline'; pill.classList.remove('online'); };
    } catch(e) {}
  </script>
</body>
</html>
