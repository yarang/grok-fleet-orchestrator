  <main>
    <h1 class="page-title">New Task</h1>
    <p class="page-subtitle">Submit a task to the fleet. It is dispatched immediately if a matching worker is available.</p>

    <div class="panel" style="max-width:640px;">
      <form id="task-form">
        <label style="display:block;margin-bottom:16px;">
          <span style="display:block;font-weight:600;margin-bottom:4px;">Prompt</span>
          <textarea name="prompt" required rows="5" placeholder="What should the agent do?" style="width:100%;box-sizing:border-box;"></textarea>
        </label>

        <label style="display:block;margin-bottom:16px;">
          <span style="display:block;font-weight:600;margin-bottom:4px;">Model</span>
          <select name="model" id="model-select" style="width:100%;box-sizing:border-box;">
            <option value="">Any available worker</option>
          </select>
          <span id="model-hint" style="display:block;font-size:12px;color:var(--ink-muted-48);margin-top:4px;">
            Populated from currently online workers' <code>model</code> label. Leave as "Any" to let the scheduler pick.
          </span>
        </label>

        <label style="display:block;margin-bottom:16px;">
          <span style="display:block;font-weight:600;margin-bottom:4px;">Project (optional)</span>
          <select name="project_id" id="project-select" style="width:100%;box-sizing:border-box;">
            <option value="">None — general pool</option>
          </select>
          <span id="project-hint" style="display:block;font-size:12px;color:var(--ink-muted-48);margin-top:4px;">
            Groups this task under a development goal. Only projects accepting new tasks are listed — draining/archived ones are omitted.
          </span>
        </label>

        <label style="display:block;margin-bottom:16px;">
          <span style="display:block;font-weight:600;margin-bottom:4px;">Custom instructions (optional)</span>
          <textarea name="custom_instructions" rows="3" placeholder="Extra rules/context prepended to the prompt (e.g. house coding style, output format)" style="width:100%;box-sizing:border-box;"></textarea>
          <span style="display:block;font-size:12px;color:var(--ink-muted-48);margin-top:4px;">
            ACP has no separate system-prompt field, so this is merged in front of the prompt above.
          </span>
        </label>

        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
          <label style="flex:1;min-width:160px;">
            <span style="display:block;font-weight:600;margin-bottom:4px;">Working directory</span>
            <input name="cwd" type="text" placeholder="/home/worker/repo" required style="width:100%;box-sizing:border-box;" />
            <span style="display:block;font-size:12px;opacity:0.7;margin-top:4px;">Absolute path on the worker where the agent session opens. Must start with <code>/</code>, must not contain <code>..</code>, and must not be <code>/</code> itself. When continuing an earlier task, the parent's directory is inherited.</span>
          </label>
          <label style="flex:0 0 140px;">
            <span style="display:block;font-weight:600;margin-bottom:4px;">Priority</span>
            <select name="priority" style="width:100%;box-sizing:border-box;">
              <option value="low">Low</option>
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
          <label style="flex:1;min-width:140px;">
            <span style="display:block;font-weight:600;margin-bottom:4px;">Max turns (optional)</span>
            <input name="max_turns" type="number" min="1" step="1" style="width:100%;box-sizing:border-box;" />
          </label>
          <label style="flex:1;min-width:140px;">
            <span style="display:block;font-weight:600;margin-bottom:4px;">Timeout, seconds (optional)</span>
            <input name="timeout_secs" type="number" min="1" step="1" style="width:100%;box-sizing:border-box;" />
          </label>
        </div>

        <div style="display:flex;gap:8px;align-items:center;">
          <button type="submit" class="btn btn-primary">Submit Task</button>
          <a href="tasks" class="btn">Cancel</a>
          <span id="submit-status" style="font-size:13px;"></span>
        </div>
      </form>
    </div>
  </main>

  <script src="static/app.js"></script>
  <script src="static/task-new.js"></script>
</body>
</html>
