<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provision Host — Fleet</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- sidebar:start -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>Fleet</h1>
      <div id="status-pill">connecting…</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-group">
      <a href="/" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Overview</span></a>
      <a href="/tasks" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1.5 1.5L8 5"/><path d="M4 12l1.5 1.5L8 11"/><path d="M4 18l1.5 1.5L8 17"/></svg><span>Tasks</span></a>
      <a href="/hosts" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r="0.8" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg><span>Hosts</span></a>
      </div>
      <div class="sidebar-group">
        <p class="sidebar-group-label">Admin</p>
      <a href="/hosts/provision" class="sidebar-link active" aria-current="page"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Provision</span></a>
      <a href="/admin/ssh-keys" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg><span>SSH Keys</span></a>
      <a href="/admin/users" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg><span>Users</span></a>
      <a href="/admin/activity" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2 7 4-14 2 7h6"/></svg><span>Activity</span></a>
      <a href="/admin/tools" class="sidebar-link"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 005.4-5.4l-2.5 2.5-2-2 2.5-2.5z"/></svg><span>Tools</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebar-user-menu"></div>
    </div>
  </aside>
  <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <!-- sidebar:end -->

  <main>
    <h1 class="page-title">Provision New Host</h1>
    <p class="page-subtitle">SSH into a remote server, install Grok, and register it as a fleet worker.</p>

    <div id="provision-panel" class="panel" style="max-width:600px;">
      <form id="provision-form" style="display:flex;flex-direction:column;gap:12px;">
        <fieldset style="border:1px solid var(--border,#ddd);padding:12px;border-radius:6px;">
          <legend style="font-weight:600;font-size:14px;">SSH Connection</legend>
          <label>Host / IP
            <input name="host" type="text" required placeholder="10.0.1.10" style="display:block;margin-top:4px;width:100%;" />
          </label>
          <div style="display:flex;gap:12px;margin-top:8px;">
            <label>SSH User
              <input name="ssh_user" type="text" required placeholder="ubuntu" style="display:block;margin-top:4px;" />
            </label>
            <label>SSH Port
              <input name="ssh_port" type="number" value="22" min="1" max="65535" style="display:block;margin-top:4px;width:80px;" />
            </label>
          </div>
          <label style="display:block;margin-top:8px;">SSH Key
            <select name="ssh_key_name" id="ssh-key-select" required style="display:block;margin-top:4px;width:100%;">
              <option value="">Loading keys…</option>
            </select>
          </label>
        </fieldset>

        <fieldset style="border:1px solid var(--border,#ddd);padding:12px;border-radius:6px;">
          <legend style="font-weight:600;font-size:14px;">Worker Configuration</legend>
          <label>Worker Name
            <input name="worker_name" type="text" required placeholder="build-arm64-01" style="display:block;margin-top:4px;width:100%;" />
          </label>
          <label>Orchestrator URL
            <input name="orchestrator_url" type="url" required placeholder="http://127.0.0.1:8081" style="display:block;margin-top:4px;width:100%;" />
          </label>
          <label>Labels (comma-separated key=value)
            <input name="labels_raw" type="text" placeholder="arch=arm64,gpu=false" style="display:block;margin-top:4px;width:100%;" />
          </label>
          <label>Bootstrap Token (optional)
            <input name="bootstrap_token" type="text" placeholder="fleet-xxx" style="display:block;margin-top:4px;width:100%;" />
          </label>
          <label>Fleet Worker Binary Path
            <input name="fleet_worker_bin" type="text" placeholder="/usr/local/bin/fleet-worker" style="display:block;margin-top:4px;width:100%;" />
          </label>
        </fieldset>

        <div style="display:flex;gap:8px;align-items:center;">
          <button type="submit" class="btn btn-primary" id="submit-btn">Provision Host</button>
          <label style="font-size:13px;display:flex;align-items:center;gap:4px;">
            <input type="checkbox" name="dry_run" /> Dry run
          </label>
        </div>
      </form>
      <div id="provision-result" style="margin-top:16px;display:none;"></div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    function getCsrf() {
      const m = document.cookie.match('(^|;)\\s*fleet_csrf\\s*=\\s*([^;]+)');
      return m ? m.pop() : '';
    }

    async function loadSshKeys() {
      const select = document.getElementById('ssh-key-select');
      try {
        const resp = await fetch('/api/ssh-keys');
        if (!resp.ok) { select.innerHTML = '<option value="">No keys available</option>'; return; }
        const keys = await resp.json();
        if (!keys || keys.length === 0) {
          select.innerHTML = '<option value="">No keys — upload one first</option>';
        } else {
          select.innerHTML = keys.map(k =>
            '<option value="' + k.name + '">' + k.name + ' (' + k.key_type + ')</option>'
          ).join('');
        }
      } catch(e) {
        select.innerHTML = '<option value="">Failed to load keys</option>';
      }
    }

    document.getElementById('provision-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);

      // labels 파싱.
      const labels = {};
      const labelsRaw = fd.get('labels_raw') || '';
      for (const pair of labelsRaw.split(',')) {
        const trimmed = pair.trim();
        if (!trimmed) continue;
        const eq = trimmed.indexOf('=');
        if (eq > 0) {
          labels[trimmed.substring(0, eq)] = trimmed.substring(eq + 1);
        }
      }

      const body = {
        host: fd.get('host'),
        ssh_port: parseInt(fd.get('ssh_port') || '22'),
        ssh_user: fd.get('ssh_user'),
        ssh_key_name: fd.get('ssh_key_name'),
        worker_name: fd.get('worker_name'),
        labels,
        orchestrator_url: fd.get('orchestrator_url'),
        bootstrap_token: fd.get('bootstrap_token') || null,
        fleet_worker_bin: fd.get('fleet_worker_bin') || '',
        dry_run: fd.get('dry_run') === 'on',
      };

      const btn = document.getElementById('submit-btn');
      const result = document.getElementById('provision-result');
      btn.disabled = true;
      btn.textContent = 'Provisioning…';
      result.style.display = 'none';

      try {
        const resp = await fetch('/api/hosts/provision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': getCsrf() },
          body: JSON.stringify(body)
        });
        const data = await resp.json();

        if (resp.ok) {
          let html = '<div style="padding:12px;border-radius:6px;background:rgba(26,125,49,0.1);border:1px solid #1a7d31;">';
          html += '<strong style="color:#1a7d31;">✓ Provisioning ' + (data.succeeded ? 'succeeded' : 'completed with errors') + '</strong>';
          if (data.steps) {
            html += '<ul style="margin:8px 0 0;padding-left:20px;font-size:13px;">';
            for (const s of data.steps) {
              const icon = s.status === 'applied' ? '✓' : s.status === 'skipped' ? '○' : '✗';
              const color = s.status === 'failed' ? '#c61e00' : '#666';
              html += '<li style="color:' + color + ';">' + icon + ' ' + s.name + '</li>';
            }
            html += '</ul>';
          }
          html += '</div>';
          result.innerHTML = html;
        } else {
          result.innerHTML = '<div style="padding:12px;border-radius:6px;background:rgba(198,30,0,0.1);border:1px solid #c61e00;color:#c61e00;"><strong>✗ Failed:</strong> ' + (data.error || 'Unknown error') + '</div>';
        }
        result.style.display = 'block';
      } catch(e) {
        result.innerHTML = '<div style="padding:12px;color:#c61e00;">Error: ' + e.message + '</div>';
        result.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Provision Host';
      }
    });

    // 사용자 메뉴는 app.js의 renderUserMenu()가 #sidebar-user-menu에 렌더링한다.
    loadSshKeys();

    // SSE
    const pill = document.getElementById('status-pill');
    try {
      const es = new EventSource('/api/events/stream');
      es.onopen = () => { pill.textContent = 'live'; pill.classList.add('online'); };
      es.onerror = () => { pill.textContent = 'offline'; pill.classList.remove('online'); };
    } catch(e) {}
  </script>
</body>
</html>
