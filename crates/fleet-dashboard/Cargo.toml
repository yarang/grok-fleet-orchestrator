[package]
name = "fleet-dashboard"
description = "Web dashboard with embedded static assets (htmx + pure HTML)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fleet-core = { workspace = true }
fleet-store = { workspace = true }
fleet-credentials = { workspace = true }
# /api/tools가 MCP 도구 카탈로그를 재선언하지 않고 단일 출처를 참조하기 위함.
fleet-mcp = { workspace = true }
# 대시보드에서 태스크 제출(POST /api/tasks) 시 Dispatcher를 직접 호출하기 위함.
fleet-scheduler = { workspace = true }
fleet-provisioner = { workspace = true, features = ["ssh"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
async-stream = { workspace = true }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query", "form"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["trace", "cors", "set-header"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
time = "0.3"
rand = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
lettre = { workspace = true }

[lib]
name = "fleet_dashboard"
path = "src/lib.rs"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
fleet-transport = { workspace = true }
