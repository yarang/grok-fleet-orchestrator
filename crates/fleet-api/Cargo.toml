[package]
name = "fleet-api"
description = "HTTP API server for worker registration, heartbeats, and admin operations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fleet-core = { workspace = true }
fleet-credentials = { workspace = true }
fleet-store = { workspace = true }
fleet-transport = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["trace", "cors", "set-header"] }
uuid = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
fleet-scheduler = { workspace = true }
fleet-store = { workspace = true, features = ["test-support"] }
fleet-transport = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_yaml = { workspace = true }
# bootstrap token digest 회귀 테스트(로드맵 #59)에서 임시 데이터베이스를
# 만들고 마이그레이션을 적용하기 위한 직접 풀 접근.
sqlx = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { version = "0.3" }
