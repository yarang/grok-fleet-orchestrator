[workspace]
resolver = "2"
members = [
    "crates/fleet-core",
    "crates/fleet-credentials",
    "crates/fleet-store",
    "crates/fleet-transport",
    "crates/fleet-scheduler",
    "crates/fleet-api",
    "crates/fleet-mcp",
    "crates/fleet-provisioner",
    "crates/fleet-dashboard",
    "crates/fleet-worker",
    "crates/fleet-cli",
]

# 2026-08-25: 벤더링한 공식 ACP Rust SDK를 워크스페이스 멤버에서 제외한다.
# 이유: clippy는 member(primary) 패키지만 채점하므로, 멤버로 남겨 두면 우리가
# 유지보수하지 않는 남의 코드의 lint가 우리 게이트를 막는다(1.98.0의
# `unused_async_trait_impl`이 `agent-client-protocol-test`에서 게이트를 즉사시켰다).
# 명령줄 `--exclude`는 멤버 선택 단계 필터일 뿐 멤버십을 바꾸지 않아 lint를 막지
# 못하므로, agent.md §4의 게이트 명령을 그대로 유지하려면 매니페스트 쪽이 정답이다.
# 부수효과: `cargo test --workspace`와 `cargo llvm-cov --workspace`가 더 이상 이
# SDK의 테스트를 포함하지 않으므로 커버리지 수치가 한 번 내려간다. 빌드 정합성은
# 유지된다 — SDK 크레이트들은 여전히 의존성으로 컴파일되며, 멤버에서 빠지는 것은
# 아무도 의존하지 않는 doctest 헬퍼(`agent-client-protocol-test`)뿐이다.
# 이 SDK를 단순 벤더링이 아니라 우리가 유지보수하는 fork로 취급하기로 하면 이
# 경계는 잘못된 위치가 된다 — 그때는 `-test`만 겨냥한 좁은 경계로 바꾼다.
exclude = ["vendor/agent-client-protocol-rust-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 2026-08-11: agent-client-protocol(공식 ACP Rust SDK, MSRV 1.88) 도입을 위해
# 1.75 -> 1.88로 상향. edition은 2021 유지 — Cargo는 의존성 그래프 내 크레이트별
# 서로 다른 edition을 문제없이 허용하므로 SDK가 2024 edition이어도 상관없다.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yarang/grok-fleet-orchestrator"
homepage = "https://github.com/yarang/grok-fleet-orchestrator"

# 공통 의존성 버전은 여기서 중앙 집중 관리.
# 각 크레이트는 `dep = { workspace = true }` 형식으로 참조.
[workspace.dependencies]
# 직렬화
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# URL
url = "2.5"

# 시간 / ID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# 에러 / 로깅
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"

# JWT 및 HTTP 요청
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 인증 / 암호화 (Phase 9.1: RBAC + cookie session)
argon2 = "0.5"
password-hash = { version = "0.5", features = ["alloc"] }
rand = "0.8"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
zxcvbn = "3"

# 이메일 (SMTP 발송)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# 비동기
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# 데이터베이스
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "macros",
] }
futures = "0.3"
async-stream = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# MCP / JSON-RPC
tokio-util = "0.7"

# OpenTelemetry / Tracing (Phase 13)
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["grpc-tonic", "trace", "tokio"] }
tracing-opentelemetry = "0.28"

# TLS (Phase 8.5: mTLS for orchestrator↔worker ACP)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
rcgen = "0.13"

# SSH 프로비저닝 (Phase 4)
russh = "0.46"
russh-keys = "0.46"
base64 = "0.22"
serde_yaml = "0.9"

# Credentials 암호화 (Phase 8.6: 워커 API 키 중앙 관리)
# (sha2 / rand / hex 는 위 auth 섹션에서 공유 사용)
aes-gcm = "0.10"
hkdf = "0.12"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# 내부 크레이트
fleet-core = { path = "crates/fleet-core", version = "0.1.0" }
fleet-credentials = { path = "crates/fleet-credentials", version = "0.1.0" }
fleet-store = { path = "crates/fleet-store", version = "0.1.0" }
fleet-transport = { path = "crates/fleet-transport", version = "0.1.0" }
fleet-scheduler = { path = "crates/fleet-scheduler", version = "0.1.0" }
fleet-api = { path = "crates/fleet-api", version = "0.1.0" }
fleet-mcp = { path = "crates/fleet-mcp", version = "0.1.0" }
fleet-provisioner = { path = "crates/fleet-provisioner", version = "0.1.0" }
fleet-dashboard = { path = "crates/fleet-dashboard", version = "0.1.0" }
fleet-worker = { path = "crates/fleet-worker", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# ─── cargo-binstall 메타데이터 ─────────────────────────────────────────
# `cargo binstall --git <this-repo> fleet-cli` 로 미리 빌드된 바이너리를 설치.
# 각 tarball 의 layout (release.yml 참조):
#   fleet-<version>-<target>.tar.gz
#     ├─ fleet           (orchestrator binary)
#     ├─ fleet-worker    (worker daemon binary)
#     ├─ install.sh
#     └─ README.md
# 실제 메타데이터는 `crates/fleet-cli/Cargo.toml` 의 `[package.metadata.binstall]`
# 참조. workspace 메타데이터는 단순 문서화 용도.
