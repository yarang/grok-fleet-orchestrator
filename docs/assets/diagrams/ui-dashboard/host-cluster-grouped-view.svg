<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .header-box { fill: #2a2b3d; stroke: #45475a; stroke-width: 1.5; rx: 8; ry: 8; }
      .kpi-card { fill: #313244; stroke: #585b70; stroke-width: 1; rx: 6; ry: 6; }
      .host-card { fill: #252636; stroke: #45475a; stroke-width: 1.5; rx: 8; ry: 8; }
      .host-card-active { fill: #252636; stroke: #89b4fa; stroke-width: 2; rx: 8; ry: 8; }
      .badge-arm { fill: #fab387; fill-opacity: 0.2; stroke: #fab387; stroke-width: 1; rx: 4; }
      .badge-x86 { fill: #89dceb; fill-opacity: 0.2; stroke: #89dceb; stroke-width: 1; rx: 4; }
      .btn { fill: #45475a; rx: 4; }
      .btn-primary { fill: #89b4fa; rx: 4; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 15px; fill: #cdd6f4; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #a6adc8; }
      .text-mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #f9e2af; }
      .meter-bg { fill: #313244; rx: 3; }
      .meter-fg { fill: #a6e3a1; rx: 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" class="bg" rx="12" />

  <!-- Navigation / Header Bar -->
  <rect x="25" y="20" width="910" height="50" class="header-box" />
  <text x="45" y="52" class="text-title" font-size="18" fill="#89b4fa">Hosts &amp; Clusters / Fleet Inventory</text>
  <rect x="760" y="30" width="155" height="30" class="btn-primary" />
  <text x="780" y="50" font-family="-apple-system, sans-serif" font-weight="bold" font-size="12" fill="#11111b">+ Import SSH Config</text>

  <!-- Top KPI Bar -->
  <rect x="25" y="85" width="170" height="60" class="kpi-card" />
  <text x="40" y="108" class="text-sub">Total Hosts</text>
  <text x="40" y="133" class="text-title" font-size="20">32 Hosts</text>

  <rect x="210" y="85" width="170" height="60" class="kpi-card" />
  <text x="225" y="108" class="text-sub">Online &amp; Ready</text>
  <text x="225" y="133" class="text-title" font-size="20" fill="#a6e3a1">28 Nodes</text>

  <rect x="395" y="85" width="170" height="60" class="kpi-card" />
  <text x="410" y="108" class="text-sub">Active Running Tasks</text>
  <text x="410" y="133" class="text-title" font-size="20" fill="#89b4fa">3 Busy</text>

  <rect x="580" y="85" width="170" height="60" class="kpi-card" />
  <text x="595" y="108" class="text-sub">Offline / Error</text>
  <text x="595" y="133" class="text-title" font-size="20" fill="#f38ba8">1 Host</text>

  <rect x="765" y="85" width="170" height="60" class="kpi-card" />
  <text x="780" y="108" class="text-sub">Cluster Capacity</text>
  <text x="780" y="133" class="text-title" font-size="18">42 / 128 Slots</text>

  <!-- Filter & Search Toolbar -->
  <rect x="25" y="155" width="910" height="40" class="header-box" />
  <text x="40" y="180" class="text-sub">Filter:</text>
  <text x="85" y="180" class="text-title" font-size="12" fill="#89b4fa">All (32)</text>
  <text x="145" y="180" class="text-sub">ARM64 (14)</text>
  <text x="235" y="180" class="text-sub">x86_64 (18)</text>
  <text x="325" y="180" class="text-sub">Idle Only</text>
  <text x="405" y="180" class="text-sub">mTLS Verified</text>

  <!-- Group 1 Header: OCI yarangdev -->
  <text x="25" y="225" class="text-title" font-size="16" fill="#fab387">▼ OCI Cluster: yarangdev (3 Hosts • All Online • ap-chuncheon-1)</text>

  <!-- Card 1: oci-yarangdev-arm1 -->
  <rect x="25" y="240" width="290" height="170" class="host-card-active" />
  <circle cx="45" cy="265" r="5" fill="#a6e3a1" />
  <text x="60" y="270" class="text-title" font-size="14">oci-yarangdev-arm1</text>
  <rect x="225" y="255" width="75" height="20" class="badge-arm" />
  <text x="237" y="269" font-family="-apple-system, sans-serif" font-size="10" fill="#fab387">ARM64 • grok</text>

  <text x="40" y="300" class="text-sub">CPU Load (24%)</text>
  <rect x="130" y="290" width="170" height="10" class="meter-bg" />
  <rect x="130" y="290" width="41" height="10" class="meter-fg" />

  <text x="40" y="325" class="text-sub">Memory (8.4/24G)</text>
  <rect x="130" y="315" width="170" height="10" class="meter-bg" />
  <rect x="130" y="315" width="60" height="10" class="meter-fg" />

  <text x="40" y="350" class="text-sub">Tasks: <tspan fill="#89b4fa" font-weight="bold">1 / 4 Active</tspan> • Circuit: <tspan fill="#a6e3a1">Closed</tspan></text>
  <text x="40" y="370" class="text-mono" font-size="10">Task #104: build-kernel (2m)</text>

  <rect x="40" y="380" width="75" height="20" class="btn-primary" />
  <text x="48" y="394" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#11111b">▶ Dispatch</text>

  <rect x="125" y="380" width="55" height="20" class="btn" />
  <text x="135" y="394" font-family="-apple-system, sans-serif" font-size="10" fill="#cdd6f4">SSH</text>

  <rect x="190" y="380" width="55" height="20" class="btn" />
  <text x="200" y="394" font-family="-apple-system, sans-serif" font-size="10" fill="#cdd6f4">Drain</text>

  <!-- Card 2: oci-yarangdev-ec1 -->
  <rect x="335" y="240" width="290" height="170" class="host-card" />
  <circle cx="355" cy="265" r="5" fill="#a6e3a1" />
  <text x="370" y="270" class="text-title" font-size="14">oci-yarangdev-ec1</text>
  <rect x="535" y="255" width="75" height="20" class="badge-x86" />
  <text x="547" y="269" font-family="-apple-system, sans-serif" font-size="10" fill="#89dceb">x86_64 • agy</text>

  <text x="350" y="300" class="text-sub">CPU Load (12%)</text>
  <rect x="440" y="290" width="170" height="10" class="meter-bg" />
  <rect x="440" y="290" width="20" height="10" class="meter-fg" />

  <text x="350" y="325" class="text-sub">Memory (2.1/8G)</text>
  <rect x="440" y="315" width="170" height="10" class="meter-bg" />
  <rect x="440" y="315" width="45" height="10" class="meter-fg" />

  <text x="350" y="350" class="text-sub">Tasks: <tspan fill="#a6e3a1">0 / 2 Idle</tspan> • Circuit: <tspan fill="#a6e3a1">Closed</tspan></text>
  <text x="350" y="370" class="text-mono" font-size="10">Ready for incoming ACP tasks</text>

  <rect x="350" y="380" width="75" height="20" class="btn-primary" />
  <text x="358" y="394" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#11111b">▶ Dispatch</text>

  <rect x="435" y="380" width="55" height="20" class="btn" />
  <text x="445" y="394" font-family="-apple-system, sans-serif" font-size="10" fill="#cdd6f4">SSH</text>

  <rect x="500" y="380" width="55" height="20" class="btn" />
  <text x="510" y="394" font-family="-apple-system, sans-serif" font-size="10" fill="#cdd6f4">Drain</text>

  <!-- Card 3: oci-yarangdev-ec2 -->
  <rect x="645" y="240" width="290" height="170" class="host-card" />
  <circle cx="665" cy="265" r="5" fill="#a6e3a1" />
  <text x="680" y="270" class="text-title" font-size="14">oci-yarangdev-ec2</text>
  <rect x="845" y="255" width="75" height="20" class="badge-x86" />
  <text x="857" y="269" font-family="-apple-system, sans-serif" font-size="10" fill="#89dceb">x86_64 • scale</text>

  <text x="660" y="300" class="text-sub">CPU Load (5%)</text>
  <rect x="750" y="290" width="170" height="10" class="meter-bg" />
  <rect x="750" y="290" width="8" height="10" class="meter-fg" />

  <text x="660" y="325" class="text-sub">Memory (1.2/8G)</text>
  <rect x="750" y="315" width="170" height="10" class="meter-bg" />
  <rect x="750" y="315" width="25" height="10" class="meter-fg" />

  <text x="660" y="350" class="text-sub">Tasks: <tspan fill="#a6e3a1">0 / 2 Idle</tspan> • Circuit: <tspan fill="#a6e3a1">Closed</tspan></text>
  <text x="660" y="370" class="text-mono" font-size="10">Standby scaleout worker</text>

  <rect x="660" y="380" width="75" height="20" class="btn-primary" />
  <text x="668" y="394" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#11111b">▶ Dispatch</text>

  <rect x="745" y="380" width="55" height="20" class="btn" />
  <text x="755" y="394" font-family="-apple-system, sans-serif" font-size="10" fill="#cdd6f4">SSH</text>

  <rect x="810" y="380" width="55" height="20" class="btn" />
  <text x="820" y="394" font-family="-apple-system, sans-serif" font-size="10" fill="#cdd6f4">Drain</text>

  <!-- Collapsed Groups -->
  <rect x="25" y="430" width="910" height="40" class="header-box" />
  <text x="45" y="455" class="text-title" font-size="14" fill="#a6adc8">▶ OCI Cluster: ajou (4 Hosts • All Online • Idle)</text>

  <rect x="25" y="480" width="910" height="40" class="header-box" />
  <text x="45" y="505" class="text-title" font-size="14" fill="#a6adc8">▶ OCI Cluster: fcoinfup (4 Hosts • All Online • Idle)</text>

  <rect x="25" y="530" width="910" height="40" class="header-box" />
  <text x="45" y="555" class="text-title" font-size="14" fill="#a6adc8">▶ Google Cloud Platform (GCP) Cluster (3 Hosts • 2 Online, 1 Offline)</text>

  <rect x="25" y="580" width="910" height="30" class="header-box" />
  <text x="45" y="600" class="text-title" font-size="13" fill="#a6adc8">▶ On-Premise / Local (1 Host • mini01: 172.16.1.101)</text>

</svg>
