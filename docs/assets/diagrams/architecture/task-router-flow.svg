<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .box { fill: #2a2b3d; stroke: #585b70; stroke-width: 2; rx: 8; ry: 8; }
      .accent-box { fill: #313244; stroke: #89b4fa; stroke-width: 2; rx: 8; ry: 8; }
      .hl-box { fill: #45475a; stroke: #a6e3a1; stroke-width: 2; rx: 8; ry: 8; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 16px; fill: #cdd6f4; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #bac2de; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #fab387; }
      .line { stroke: #89dceb; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #11111b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89dceb" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" class="bg" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="text-title" font-size="20" fill="#89b4fa">Fleet TaskRouter 2-Tier Architecture</text>
  <text x="40" y="70" class="text-sub">Deterministic Heuristic Scoring &amp; Multi-Vendor Adaptive Routing</text>

  <!-- Stage 1: Input Analysis -->
  <rect x="40" y="105" width="240" height="350" class="box" />
  <text x="60" y="135" class="text-title">1. Task Ingestion</text>
  <text x="60" y="160" class="text-sub">• Prompt Content &amp; Length</text>
  <text x="60" y="185" class="text-sub">• Required Skills (e.g. rust-expert)</text>
  <text x="60" y="210" class="text-sub">• Explicit Server / Model Hint</text>
  <text x="60" y="235" class="text-sub">• User routing_profile override</text>
  
  <rect x="60" y="265" width="200" height="160" class="accent-box" />
  <text x="75" y="295" class="text-title" font-size="14">Heuristic Dimensions</text>
  <text x="75" y="325" class="text-code">1. Typo / Linting</text>
  <text x="75" y="350" class="text-code">2. Feature / CRUD</text>
  <text x="75" y="375" class="text-code">3. Architecture / Scale</text>
  <text x="75" y="400" class="text-code">4. Formal Reasoning</text>

  <!-- Flow Line 1 -> 2 -->
  <path d="M 280 280 L 330 280" class="line" />

  <!-- Stage 2: Logical Profile -->
  <rect x="330" y="105" width="250" height="350" class="box" />
  <text x="350" y="135" class="text-title">2. Profile Classification</text>
  
  <!-- Economy -->
  <rect x="350" y="155" width="210" height="60" class="hl-box" stroke="#a6e3a1" />
  <text x="365" y="180" class="text-title" font-size="14" fill="#a6e3a1">Economy (40k Budget)</text>
  <text x="365" y="200" class="text-sub" font-size="11">Lightweight edits, typo, format</text>

  <!-- Balanced -->
  <rect x="350" y="225" width="210" height="60" class="hl-box" stroke="#89b4fa" />
  <text x="365" y="250" class="text-title" font-size="14" fill="#89b4fa">Balanced (100k Budget)</text>
  <text x="365" y="270" class="text-sub" font-size="11">Standard feature &amp; test building</text>

  <!-- Complex -->
  <rect x="350" y="295" width="210" height="60" class="hl-box" stroke="#fab387" />
  <text x="365" y="320" class="text-title" font-size="14" fill="#fab387">Complex (250k Budget)</text>
  <text x="365" y="340" class="text-sub" font-size="11">Refactoring, multi-file changes</text>

  <!-- Reasoning -->
  <rect x="350" y="365" width="210" height="60" class="hl-box" stroke="#f38ba8" />
  <text x="365" y="390" class="text-title" font-size="14" fill="#f38ba8">Reasoning (500k Budget)</text>
  <text x="365" y="410" class="text-sub" font-size="11">Formal proof, math, invariants</text>

  <!-- Flow Line 2 -> 3 -->
  <path d="M 580 280 L 630 280" class="line" />

  <!-- Stage 3: Physical Resolution -->
  <rect x="630" y="105" width="230" height="350" class="box" />
  <text x="650" y="135" class="text-title">3. Physical Dispatch</text>
  
  <rect x="650" y="155" width="190" height="60" class="accent-box" />
  <text x="665" y="180" class="text-title" font-size="13">grok-code-fast</text>
  <text x="665" y="200" class="text-code">Vendor: grok</text>

  <rect x="650" y="225" width="190" height="60" class="accent-box" />
  <text x="665" y="250" class="text-title" font-size="13">gemini-2.5-flash</text>
  <text x="665" y="270" class="text-code">Vendor: agy / gemini</text>

  <rect x="650" y="295" width="190" height="60" class="accent-box" />
  <text x="665" y="320" class="text-title" font-size="13">grok-4</text>
  <text x="665" y="340" class="text-code">Vendor: grok</text>

  <rect x="650" y="365" width="190" height="60" class="accent-box" />
  <text x="665" y="390" class="text-title" font-size="13">deepseek-r1</text>
  <text x="665" y="410" class="text-code">Vendor: gemini</text>

</svg>
