<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="'SF Mono','Menlo','Consolas',monospace">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="260" fill="#ffffff"/>

  <!-- Layer 1: Cloudflare Access -->
  <rect x="60" y="20" width="580" height="72" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="350" y="46" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c2d12">[1단계: 네트워크 경계] Cloudflare Access (Identity Wall)</text>
  <text x="350" y="68" text-anchor="middle" font-size="11.5" fill="#7c2d12">사전에 등록된 Cloudflare Service Token이 헤더에 존재해야 유입 허용</text>

  <!-- arrow -->
  <line x1="350" y1="92" x2="350" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="366" y="114" font-size="11" fill="#64748b">(Pass)</text>

  <!-- Layer 2: Bootstrap Token -->
  <rect x="60" y="128" width="580" height="72" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350" y="154" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">[2단계: 애플리케이션 가입] Stateful Bootstrap Token</text>
  <text x="350" y="176" text-anchor="middle" font-size="11.5" fill="#1e3a8a">유효 기한 및 최대 사용 횟수가 검증된 경우에만 워커 가입 최종 승인</text>

  <text x="350" y="230" text-anchor="middle" font-size="10.5" fill="#94a3b8">인터넷 노출 환경에서의 2단계 방어(Defense-in-Depth) — 네트워크 경계 + 애플리케이션 인증</text>
</svg>
