<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'SF Mono','Menlo','Consolas',monospace">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- Scenario 1 -->
  <rect x="20" y="16" width="720" height="96" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="380" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">[시나리오 1] SSH 원클릭 프로비저닝 (자동화, 권장)</text>
  <rect x="60" y="58" width="140" height="36" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.2"/>
  <text x="130" y="80" text-anchor="middle" font-size="11.5" fill="#14532d">Orchestrator</text>
  <line x1="200" y1="76" x2="530" y2="76" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <text x="365" y="68" text-anchor="middle" font-size="10" fill="#166534">SSH/SFTP를 통해 임시 생성 후 주입</text>
  <rect x="530" y="58" width="140" height="36" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.2"/>
  <text x="600" y="80" text-anchor="middle" font-size="11.5" fill="#14532d">Worker</text>

  <text x="380" y="130" text-anchor="middle" font-size="11" fill="#94a3b8">OR</text>

  <!-- Scenario 2 -->
  <rect x="20" y="146" width="720" height="96" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="380" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">[시나리오 2] CLI/대시보드 수동 복사 (수동 / 소규모)</text>
  <rect x="60" y="188" width="140" height="36" rx="4" fill="#ffffff" stroke="#eab308" stroke-width="1.2"/>
  <text x="130" y="210" text-anchor="middle" font-size="11.5" fill="#713f12">Admin Web/CLI</text>
  <line x1="200" y1="206" x2="530" y2="206" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <text x="365" y="198" text-anchor="middle" font-size="10" fill="#854d0e">관리자가 수동 복사/붙여넣기</text>
  <rect x="530" y="188" width="140" height="36" rx="4" fill="#ffffff" stroke="#eab308" stroke-width="1.2"/>
  <text x="600" y="210" text-anchor="middle" font-size="11.5" fill="#713f12">Worker CLI</text>

  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#94a3b8">OR</text>

  <!-- Scenario 3 -->
  <rect x="20" y="276" width="720" height="96" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">[시나리오 3] Cloud-init / Metadata 주입 (클라우드 네이티브)</text>
  <rect x="60" y="318" width="140" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="130" y="340" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Terraform</text>
  <line x1="200" y1="336" x2="530" y2="336" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <text x="365" y="328" text-anchor="middle" font-size="10" fill="#1d4ed8">Secrets Manager / User Data 주입</text>
  <rect x="530" y="318" width="140" height="36" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="600" y="340" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Auto-scaling VM</text>
</svg>
