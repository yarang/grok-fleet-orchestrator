<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'SF Mono','Menlo','Consolas',monospace">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="300" fill="#ffffff"/>

  <!-- 관리자 -->
  <rect x="20" y="24" width="140" height="52" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="90" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">관리자</text>

  <!-- 워커 운영자/스크립트 -->
  <rect x="380" y="24" width="220" height="52" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="490" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">워커 운영자 / 스크립트</text>

  <!-- arrow 1 -->
  <line x1="160" y1="50" x2="378" y2="50" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="269" y="40" text-anchor="middle" font-size="11" fill="#64748b">1. 생성 및 전달</text>

  <!-- arrow 2: down to API box -->
  <line x1="490" y1="76" x2="490" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="490" y="98" text-anchor="middle" font-size="11" fill="#64748b">2. Join API 호출 (Bearer Auth)</text>

  <!-- Orchestrator API box -->
  <rect x="140" y="120" width="520" height="130" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Orchestrator API (/v1/workers/join)</text>
  <line x1="156" y1="158" x2="644" y2="158" stroke="#bfdbfe" stroke-width="1"/>
  <text x="400" y="182" text-anchor="middle" font-size="11.5" fill="#1e3a8a">- DB에서 토큰 존재 여부, 만료 여부 검증</text>
  <text x="400" y="206" text-anchor="middle" font-size="11.5" fill="#1e3a8a">- UPDATE ... SET use_count = use_count + 1 (Atomic)</text>
  <text x="400" y="230" text-anchor="middle" font-size="11.5" fill="#1e3a8a">- 검증 성공 시, 가입 허가 및 워커 전용 고유 API Key 발급</text>

  <text x="400" y="280" text-anchor="middle" font-size="10.5" fill="#94a3b8">1단계: 상태 저장형 부트스트랩 토큰 (Stateful Bootstrap Token) — 권장 인증 방안</text>
</svg>
