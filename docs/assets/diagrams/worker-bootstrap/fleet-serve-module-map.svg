<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'SF Mono','Menlo','Consolas',monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <!-- Root: fleet serve -->
  <rect x="360" y="16" width="180" height="46" rx="6" fill="#0f172a" stroke="#0f172a"/>
  <text x="450" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">fleet serve</text>

  <!-- spawn line -->
  <line x1="450" y1="62" x2="450" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="80" font-size="12" fill="#64748b">(Spawns)</text>

  <!-- branch bar -->
  <line x1="120" y1="92" x2="780" y2="92" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="92" x2="120" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="92" x2="450" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="92" x2="780" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 1: HTTP API Server -->
  <rect x="20" y="112" width="200" height="150" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">HTTP API Server</text>
  <text x="120" y="153" text-anchor="middle" font-size="11" fill="#3b5787">(Axum Router)</text>
  <line x1="34" y1="163" x2="206" y2="163" stroke="#bfdbfe" stroke-width="1"/>
  <text x="34" y="181" font-size="10.5" fill="#1e3a8a">- /v1/workers/register</text>
  <text x="34" y="197" font-size="10.5" fill="#1e3a8a">- /v1/workers/heartbeat</text>
  <text x="34" y="213" font-size="10.5" fill="#1e3a8a">- /v1/bootstrap-tokens</text>
  <text x="34" y="229" font-size="10.5" fill="#1e3a8a">- fleet-dashboard 크레이트</text>
  <text x="34" y="243" font-size="10.5" fill="#1e3a8a">  (별도 마운트, 아래 참고)</text>

  <!-- Column 2: MCP stdio Server -->
  <rect x="350" y="112" width="200" height="150" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="450" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">MCP stdio Server</text>
  <text x="450" y="153" text-anchor="middle" font-size="11" fill="#3f6b4a">(JSON-RPC 2.0)</text>
  <line x1="364" y1="163" x2="536" y2="163" stroke="#bbf7d0" stroke-width="1"/>
  <text x="364" y="181" font-size="10.5" fill="#14532d">MCP 도구 8개:</text>
  <text x="364" y="197" font-size="10.5" fill="#14532d">fleet_dispatch_task,</text>
  <text x="364" y="213" font-size="10.5" fill="#14532d">fleet_get_task_status,</text>
  <text x="364" y="229" font-size="10.5" fill="#14532d">fleet_list_workers 외 5개</text>
  <text x="364" y="245" font-size="10.5" fill="#14532d">(fleet-mcp/src/schema.rs)</text>

  <!-- Column 3: Background Loops -->
  <rect x="680" y="112" width="200" height="150" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="780" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Background Loops</text>
  <line x1="694" y1="150" x2="866" y2="150" stroke="#fde68a" stroke-width="1"/>
  <text x="694" y="168" font-size="10.5" fill="#713f12">- Dispatcher (이벤트 기반,</text>
  <text x="694" y="182" font-size="10.5" fill="#713f12">  mpsc 채널 소비)</text>
  <text x="694" y="200" font-size="10.5" fill="#713f12">- Reconciler (30s 안전망,</text>
  <text x="694" y="214" font-size="10.5" fill="#713f12">  정체 태스크 sweep)</text>
  <text x="694" y="232" font-size="10.5" fill="#713f12">- Health Checker (15s,</text>
  <text x="694" y="246" font-size="10.5" fill="#713f12">  45s/3회 누락→Offline)</text>

  <!-- footer note: fleet-dashboard -->
  <rect x="20" y="290" width="860" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">별도 크레이트: fleet-dashboard</text>
  <text x="450" y="336" text-anchor="middle" font-size="11" fill="#475569">자체 라우터(/, /tasks, /hosts, /admin/* 등)로 서빙 — fleet serve가 함께 기동</text>

  <text x="450" y="384" text-anchor="middle" font-size="10.5" fill="#94a3b8">근거: crates/fleet-cli/src/runtime.rs (run_serve) · crates/fleet-api/src/app.rs · crates/fleet-dashboard/src/app.rs — 2026-08-12 코드 대조</text>
</svg>
