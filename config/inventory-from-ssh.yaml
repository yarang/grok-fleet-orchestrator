# config/inventory-from-ssh.yaml
#
# ~/.ssh/config 에서 추출한 Fleet Orchestrator 전체 프로비저닝 인벤토리.
#
# 사용법:
#   # 전체 호스트 드라이런 확인
#   fleet provision --inventory config/inventory-from-ssh.yaml --dry-run
#
#   # 특정 그룹만 프로비저닝 (예: yarangdev 그룹)
#   fleet provision --inventory config/inventory-from-ssh.yaml --tags yarangdev
#
#   # 특정 호스트만 프로비저닝 (예: arm1)
#   fleet provision --inventory config/inventory-from-ssh.yaml --only oci-yarangdev-arm1
#
# 인벤토리 이력:
#   * 2026-08-22 — 모든 계정의 arm2 인스턴스(yarang / ajou / fcoinfup / cyrus /
#     boom / bok 6대)를 리소스 사유로 **영구 삭제**하고 인벤토리에서 제거했다.
#     재생성 계획 없음. arm2 이름을 다시 쓰려면 새 인스턴스를 만들어야 한다.
#   * 2026-08-22 — `oci-ajou-arm1`이 운영 중임을 확인하고 되돌렸다. 커밋
#     50ce018의 "terminated" 판단은 사실이 아니었다.
#   * 2026-08-23 — `options.retry_failed`(참조 0건이던 죽은 필드)를 스키마에서
#     제거했다(로드맵 #83). dry-run이 아닌 실 프로비저닝에는 `--api-token` 또는
#     `FLEET_API_TOKEN`이 필요하다(로드맵 #82의 JoinWorker가 소비) — 이 파일은
#     비밀을 커밋하지 않으므로 `options.api_token`을 두지 않는다.

defaults:
  user: ubuntu
  ssh_port: 22
  host_key_policy: tofu

options:
  orchestrator_url: https://fleet.agentthread.dev
  parallel: 4

workers:
  # ═══════════════════════════════════════════════════════════════════════
  # 1. OCI - yarangdev 계정 (기본 주력 워커군)
  # ═══════════════════════════════════════════════════════════════════════
  - host: oci-yarangdev-arm1.fcoinfup.com
    name: oci-yarangdev-arm1
    ssh_key: ~/CERT/login_oci4
    labels:
      arch: arm64
      tier: build
      group: yarangdev
      cloud: oci
      region: ap-chuncheon-1

  - host: oci-yarangdev-ec1.fcoinfup.com
    name: oci-yarangdev-ec1
    ssh_key: ~/CERT/login_oci4
    labels:
      arch: x86_64
      tier: general
      group: yarangdev
      cloud: oci
      region: ap-chuncheon-1

  - host: oci-yarangdev-ec2.fcoinfup.com
    name: oci-yarangdev-ec2
    ssh_key: ~/CERT/login_oci4
    labels:
      arch: x86_64
      tier: scaleout
      group: yarangdev
      cloud: oci
      region: ap-chuncheon-1

  # ═══════════════════════════════════════════════════════════════════════
  # 2. OCI - yarang 계정
  # ═══════════════════════════════════════════════════════════════════════
  # oci-yarang-arm1은 현재 중지 상태이며 2026-09에 복구 예정이다. 인벤토리에는
  # 남겨두되, 복구 전에는 프로비저닝이 SSH 연결 실패로 끝난다.
  - host: oci-yarang-arm1.fcoinfup.com
    name: oci-yarang-arm1
    ssh_key: ~/CERT/login_oci3
    labels:
      arch: arm64
      group: yarang
      cloud: oci

  - host: oci-yarang-ec1.fcoinfup.com
    name: oci-yarang-ec1
    ssh_key: ~/CERT/login_oci3
    labels:
      arch: x86_64
      group: yarang
      cloud: oci

  - host: oci-yarang-ec2.fcoinfup.com
    name: oci-yarang-ec2
    ssh_key: ~/CERT/login_oci3
    labels:
      arch: x86_64
