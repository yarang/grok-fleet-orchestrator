# config/inventory-from-ssh.yaml
#
# ~/.ssh/config 에서 추출한 Fleet Orchestrator 전체 프로비저닝 인벤토리.
#
# 사용법:
#   # 전체 호스트 드라이런 확인
#   fleet provision --inventory config/inventory-from-ssh.yaml --dry-run
#
#   # 특정 그룹만 프로비저닝 (예: yarangdev 그룹)
#   fleet provision --inventory config/inventory-from-ssh.yaml --tags yarangdev
#
#   # 특정 호스트만 프로비저닝 (예: arm1)
#   fleet provision --inventory config/inventory-from-ssh.yaml --only oci-yarangdev-arm1

defaults:
  user: ubuntu
  ssh_port: 22
  host_key_policy: tofu

options:
  orchestrator_url: https://fleet.agentthread.dev
  parallel: 4
  retry_failed: true

workers:
  # ═══════════════════════════════════════════════════════════════════════
  # 1. OCI - yarangdev 계정 (기본 주력 워커군)
  # ═══════════════════════════════════════════════════════════════════════
  - host: oci-yarangdev-arm1.fcoinfup.com
    name: oci-yarangdev-arm1
    ssh_key: ~/CERT/login_oci4
    labels:
      arch: arm64
      tier: build
      group: yarangdev
      cloud: oci
      region: ap-chuncheon-1

  - host: oci-yarangdev-ec1.fcoinfup.com
    name: oci-yarangdev-ec1
    ssh_key: ~/CERT/login_oci4
    labels:
      arch: x86_64
      tier: general
      group: yarangdev
      cloud: oci
      region: ap-chuncheon-1

  - host: oci-yarangdev-ec2.fcoinfup.com
    name: oci-yarangdev-ec2
    ssh_key: ~/CERT/login_oci4
    labels:
      arch: x86_64
      tier: scaleout
