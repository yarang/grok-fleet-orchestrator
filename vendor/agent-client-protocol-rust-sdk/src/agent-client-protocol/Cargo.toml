[package]
name = "agent-client-protocol"
version = "2.0.0"
# FLEET PATCH (2026-08-11): 이 파일의 모든 `.workspace = true` 상속을 리터럴
# 값으로 풀었다. Cargo는 path 의존성이 상위(Fleet) 워크스페이스 그래프 안에서
# 해석될 때, 그 크레이트 자신의 [workspace] 선언(../../Cargo.toml)을 무시하고
# 상위 워크스페이스의 [workspace.package]/[workspace.dependencies]로
# `.workspace = true`를 풀려고 시도한다 — Fleet 워크스페이스엔 `authors` 등이
# 없어서 "workspace.package.authors was not defined" 에러가 났다. 값은 원본
# ../../Cargo.toml의 [workspace.package]/[workspace.dependencies]에서 그대로
# 복사했다 — 실제 동작은 바뀌지 않는다. 상세: FLEET_PATCHES.md.
edition = "2024"
rust-version = "1.88.0"
authors = ["Zed <hi@zed.dev>"]
license = "Apache-2.0"
repository = "https://github.com/agentclientprotocol/rust-sdk"
homepage = "https://github.com/agentclientprotocol/rust-sdk"
description = "Core protocol types and traits for the Agent Client Protocol"
keywords = ["acp", "agent", "protocol", "ai"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

# Forward unstable features from agent-client-protocol-schema.
# Enable these to get support for the corresponding unstable ACP surfaces.
unstable = [
    "unstable_auth_methods",
    "unstable_elicitation",
    "unstable_end_turn_token_usage",
    "unstable_llm_providers",
    "unstable_mcp_over_acp",
    "unstable_plan_operations",
    "unstable_session_fork",
    "unstable_tool_call_name",
]
unstable_auth_methods = ["agent-client-protocol-schema/unstable_auth_methods"]
unstable_elicitation = ["agent-client-protocol-schema/unstable_elicitation"]
unstable_end_turn_token_usage = ["agent-client-protocol-schema/unstable_end_turn_token_usage"]
unstable_llm_providers = ["agent-client-protocol-schema/unstable_llm_providers"]
unstable_mcp_over_acp = ["agent-client-protocol-schema/unstable_mcp_over_acp"]
unstable_plan_operations = ["agent-client-protocol-schema/unstable_plan_operations"]
unstable_session_fork = ["agent-client-protocol-schema/unstable_session_fork"]
unstable_tool_call_name = ["agent-client-protocol-schema/unstable_tool_call_name"]
unstable_protocol_v2 = ["agent-client-protocol-schema/unstable_protocol_v2"]

[dependencies]
agent-client-protocol-schema = { version = "=1.6.0", features = ["tracing"] }
agent-client-protocol-derive = { path = "../agent-client-protocol-derive", version = "2.0.0" }
futures = "0.3.32"
futures-concurrency = "7.6.3"
rustc-hash = "2.1.1"
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tracing = "0.1"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-io = "2"
async-process = "2"
blocking = "1"
shell-words = "1.1"

[target.'cfg(all(unix, not(target_family = "wasm")))'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
agent-client-protocol-test = { path = "../agent-client-protocol-test" }
clap = { version = "4.5", features = ["derive"] }
expect-test = "1.5"
tokio = { version = "1.52", default-features = false, features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }

# FLEET PATCH (2026-08-11): 워크스페이스 상속 제거로 인해 원래
# ../../Cargo.toml [workspace.lints]에 있던 설정이 사라져, path dependency로
# 소비될 때(= clippy가 이 크레이트도 "로컬" 코드로 취급) 원래 pedantic=warn/
# type_complexity=allow 등으로 억제되던 지적들이 그대로 노출된다. 원본과
# 동일한 설정을 그대로 복사해 upstream 의도를 보존한다.
[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
let_underscore = "warn"
missing_debug_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
type_complexity = "allow"
wildcard_imports = "allow"
