# examples/workers.yaml
#
# SSH 자동 프로비저닝용 인벤토리 (`fleet provision --inventory`).
# `crates/fleet-provisioner/src/inventory.rs::Inventory` 스키마와 1:1 매핑.
#
# 사용:
#   fleet provision --inventory examples/workers.yaml \
#                   --ssh-key ~/.ssh/id_ed25519
#
# 동작:
#   1. 각 호스트에 SSH 접속.
#   2. (필요 시) cloudflared 설치 및 tunnel 연결.
#   3. grok CLI + fleet-worker 바이너리 배포.
#   4. /etc/fleet/worker.toml 생성 (각 호스트의 name/labels 자동 치환).
#   5. systemd 유닛 활성화 (examples/fleet-worker.service 참조).
#   6. orchestrator 에 워커로 등록.

# ─── 공통 기본값 (각 워커가 오버라이드 가능) ───────────────────────────
defaults:
  user: ubuntu
  ssh_key: ~/.ssh/id_ed25519   # None 이면 --ssh-key 플래그 필수
  ssh_port: 22
  # Cloudflare API 토큰 — tunnel 자동 생성에 필요. 미지정 시 tunnel 건너뜀.
  # cf_token: cloudflare-api-token-from-dashboard
  # SSH 서버 호스트 키 검증 정책: accept-all | tofu | strict
  #   tofu(기본) — 첫 연결에서 known_hosts 에 키 자동 추가 후 일치 검사
  #   strict   — known_hosts 에 반드시 있어야 함 (운영 권장)
  #   accept-all — 검증 생략 (위험, 테스트 전용)
  # CLI `--host-key-policy` 가 있으면 이 값을 덮어쓴다.
  host_key_policy: strict
  # known_hosts 파일 경로. 미지정 시 ~/.ssh/known_hosts.
  # known_hosts: /etc/fleet/known_hosts
  #
  # mTLS 종단 proxy (선택, Phase 8.5 / 로드맵 #37). 여러 워커가 공유하는 값만
  # defaults에 둔다 — 서버 인증서/키는 워커마다 고유해야 하므로 아래 workers:
  # 항목에서만 지정한다(`mtls_server_cert`/`mtls_server_key`).
  # 각 워커의 인증서는 사전에 `fleet mtls issue-server`로 발급해 두어야 하며,
  # 프로비저너는 파일을 업로드하지 않고 worker.toml의 경로만 채운다.
  # mtls_enabled: true
  # mtls_listen_addr: "0.0.0.0:2420"
  # mtls_client_ca: /etc/fleet/ca.pem
  # mtls_advertised_port: 2420

# ─── 프로비저닝 동작 옵션 ──────────────────────────────────────────────
options:
  # orchestrator 의 퍼블릭 URL. 워커의 worker.toml 에 자동으로 들어감.
  orchestrator_url: https://fleet.agentthread.dev
  # 동시에 프로비저닝할 호스트 수. 네트워크/disk I/O 고려해 조정.
  parallel: 2
  # 1차 실패 시 재시도.
  retry_failed: true
  # 이 태그가 달린 워커만 프로비저닝 (빈 배열 = 전체).
  tags: []
  # 이 이름의 워커만 프로비저닝 (빈 배열 = 전체).
  only: []
  # 실제 변경사항 없이 어떤 단계가 실행될지 미리 보기.
  dry_run: false
  # orchestrator 등록용 bootstrap 토큰. `fleet token new` 로 발급한 값.
  # 운영 환경에서는 환경변수 FLEET_BOOTSTRAP_TOKEN 으로 주입 권장.
  # bootstrap_token: fleet-xxxxxxxxxxxxxxxxxxxxxxxx

# ─── 워커 목록 ─────────────────────────────────────────────────────────
# 각 엔트리의 최소 필수 필드는 host, name, grok_secret.
# grok_secret 은 워커의 worker.toml [grok] secret 으로 들어감 (ACP 인증).
# 32바이트 랜덤 hex 권장 (`openssl rand -hex 32`).
workers:
  - host: 10.0.1.10
    name: build-arm64-01
    labels:
      arch: arm64
      gpu: "false"
      region: ap-northeast-2
    region: ap-northeast-2
    grok_secret: "REPLACE_WITH_RANDOM_32_BYTE_HEX"

  - host: 10.0.1.11
    name: build-arm64-02
    labels:
      arch: arm64
      gpu: "false"
      region: ap-northeast-2
    region: ap-northeast-2
    grok_secret: "REPLACE_WITH_RANDOM_32_BYTE_HEX"

  - host: 10.0.2.20
    name: gpu-x86-01
    user: ec2-user             # defaults.user 오버라이드
    ssh_port: 2222             # defaults.ssh_port 오버라이드
    labels:
      arch: x86_64
      gpu: "true"
      region: us-west-2
    region: us-west-2
    grok_secret: "REPLACE_WITH_RANDOM_32_BYTE_HEX"
    # mTLS 예시 — defaults.mtls_enabled가 꺼져 있어도 워커별로 켤 수 있다.
    # mtls_enabled: true
    # mtls_server_cert: /etc/fleet/gpu-x86-01.pem   # fleet mtls issue-server로 사전 발급
    # mtls_server_key: /etc/fleet/gpu-x86-01.key
    # mtls_advertised_host: gpu-x86-01.fleet.internal  # 미지정 시 name(gpu-x86-01)으로 폴백
