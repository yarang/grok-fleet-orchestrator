# examples/workers.yaml
#
# SSH 자동 프로비저닝용 인벤토리 (`fleet provision --inventory`).
# `crates/fleet-provisioner/src/inventory.rs::Inventory` 스키마와 1:1 매핑.
#
# 사용:
#   fleet provision --inventory examples/workers.yaml \
#                   --ssh-key ~/.ssh/id_ed25519 \
#                   --api-token "$FLEET_API_TOKEN"
#
# 동작 (로드맵 #82로 갱신):
#   1. 각 호스트에 SSH 접속.
#   2. (필요 시) cloudflared 설치 및 tunnel 연결.
#   3. grok CLI + fleet-worker 바이너리 배포.
#   4. api_token으로 호스트별 1회용 bootstrap token을 발급받고, 원격에서
#      `fleet-worker join`을 실행 — /etc/fleet/worker.toml은 그 원격 프로세스가
#      오케스트레이터의 join 응답을 그대로 디스크에 기록한다(프로비저너는
#      로컬에서 렌더링하지 않는다).
#   5. systemd 유닛 활성화 (examples/fleet-worker.service 참조).
#   6. credentials push, 서비스 기동.

# ─── 공통 기본값 (각 워커가 오버라이드 가능) ───────────────────────────
defaults:
  user: ubuntu
  ssh_key: ~/.ssh/id_ed25519   # None 이면 --ssh-key 플래그 필수
  ssh_port: 22
  # Cloudflare API 토큰 — tunnel 자동 생성에 필요. 미지정 시 tunnel 건너뜀.
  # cf_token: cloudflare-api-token-from-dashboard
  # SSH 서버 호스트 키 검증 정책: accept-all | tofu | strict
  #   tofu(기본) — 첫 연결에서 known_hosts 에 키 자동 추가 후 일치 검사
  #   strict   — known_hosts 에 반드시 있어야 함 (운영 권장)
  #   accept-all — 검증 생략 (위험, 테스트 전용)
  # CLI `--host-key-policy` 가 있으면 이 값을 덮어쓴다.
  host_key_policy: strict
  # known_hosts 파일 경로. 미지정 시 ~/.ssh/known_hosts.
  # known_hosts: /etc/fleet/known_hosts
  #
  # fleet-worker 바이너리 배포 소스 (로드맵 #83). 이기종 fleet(arm64 + x86_64가
  # 섞여 있음)에서는 아키텍처별 맵이 fleet_worker_bin(단일 폴백)보다 우선한다.
  # 워커별로 다시 오버라이드하려면 아래 workers: 항목에 fleet_worker_bin을 둔다.
  # fleet_worker_bin: ./target/release/fleet-worker
  # fleet_worker_bin_by_arch:
  #   x86_64: ./target/release/fleet-worker
  #   aarch64: ./target/aarch64-unknown-linux-gnu/release/fleet-worker
  #
  # mTLS 종단 proxy (선택, 로드맵 #85). 서버 인증서는 워커마다 IssueMtlsAssets가
  # 자동으로 발급·업로드한다 — 경로를 지정할 필요가 없다. CA 위치는
  # options.mtls_ca_dir 하나로 fleet 전체가 공유한다(아래 options: 참고).
  # mtls_enabled: true
  # mtls_listen_addr: "0.0.0.0:2420"
  # mtls_advertised_port: 2420

# ─── 프로비저닝 동작 옵션 ──────────────────────────────────────────────
options:
  # orchestrator 의 퍼블릭 URL. 워커의 worker.toml 에 자동으로 들어감.
  orchestrator_url: https://fleet.agentthread.dev
  # 동시에 프로비저닝할 호스트 수. 네트워크/disk I/O 고려해 조정.
  parallel: 2
  # 이 태그가 달린 워커만 프로비저닝 (빈 배열 = 전체).
  tags: []
  # 이 이름의 워커만 프로비저닝 (빈 배열 = 전체).
  only: []
  # 실제 변경사항 없이 어떤 단계가 실행될지 미리 보기.
  dry_run: false
  # 오케스트레이터 관리 API 용 bearer 토큰. dry-run이 아니면 필수다 —
  # JoinWorker(token:issue)와 PushCredentials(worker:llm_credential:read/:export)가
  # 이 토큰을 쓴다(로드맵 #82, #83). 운영 환경에서는 환경변수 FLEET_API_TOKEN
  # 으로 주입 권장(여기 원문을 남기지 않는다).
  # api_token: fat_xxxxxxxxxxxxxxxxxxxxxxxx
  # mtls_enabled인 워커가 하나라도 있으면 필수. `fleet mtls init-ca`가 만든
  # 로컬 CA 디렉토리(`ca.pem` + `ca.key`) — fleet 전체가 공유하는 단일 신뢰
  # 앵커다(로드맵 #85). CA 비밀키는 절대 원격에 업로드되지 않는다.
  # mtls_ca_dir: /secure/path/fleet-mtls-ca

# ─── 워커 목록 ─────────────────────────────────────────────────────────
# 각 엔트리의 최소 필수 필드는 host, name.
# grok_secret은 선택 사항이다 — 미지정 시 원격 fleet-worker join이 무작위로
# 생성한다(로드맵 #82). 재현 가능한 값을 강제하고 싶을 때만 지정한다.
# 지정하려면 32바이트 랜덤 hex 권장 (`openssl rand -hex 32`).
workers:
  - host: 10.0.1.10
    name: build-arm64-01
    labels:
      arch: arm64
      gpu: "false"
      region: ap-northeast-2
    region: ap-northeast-2
    grok_secret: "REPLACE_WITH_RANDOM_32_BYTE_HEX"

  - host: 10.0.1.11
    name: build-arm64-02
    labels:
      arch: arm64
      gpu: "false"
      region: ap-northeast-2
    region: ap-northeast-2
    grok_secret: "REPLACE_WITH_RANDOM_32_BYTE_HEX"

  - host: 10.0.2.20
    name: gpu-x86-01
    user: ec2-user             # defaults.user 오버라이드
    ssh_port: 2222             # defaults.ssh_port 오버라이드
    labels:
      arch: x86_64
      gpu: "true"
      region: us-west-2
    region: us-west-2
    grok_secret: "REPLACE_WITH_RANDOM_32_BYTE_HEX"
    # mTLS 예시 — defaults.mtls_enabled가 꺼져 있어도 워커별로 켤 수 있다.
    # 서버 인증서는 options.mtls_ca_dir로 자동 발급되므로 경로 지정 불필요.
    # mtls_enabled: true
    # mtls_advertised_host: gpu-x86-01.fleet.internal  # 미지정 시 name(gpu-x86-01)으로 폴백
