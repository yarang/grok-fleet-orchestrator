# examples/egress-proxy/haproxy.cfg
#
# 8개 워커 노드(oci-yarang-*, oci-yarangdev-*)의 api.z.ai 아웃바운드 트래픽을
# 단일 고정 IP로 통합하는 SNI 기반 TCP 릴레이.
#
# 설계 의도:
#   grok CLI(외부 바이너리)가 HTTP_PROXY/HTTPS_PROXY 환경변수를 실제로
#   존중하는지 검증되지 않았으므로, HTTP(S) 프록시 프로토콜(CONNECT)에
#   의존하지 않는다. 대신 TLS ClientHello의 SNI만 보고 raw TCP를 그대로
#   중계(passthrough)한다 — TLS를 종단하지 않으므로 인증서 문제가 없고,
#   애플리케이션이 프록시를 "인지"할 필요가 전혀 없다.
#
# 전제 조건:
#   워커 노드에서 api.z.ai 를 조회하면 이 프록시의 IP(내부망이면 사설 IP,
#   아니면 프록시의 공인 IP)로 응답하도록 DNS/hosts를 오버라이드해야 한다.
#   (README.md 참조)
#
# 설치:
#   apt-get install haproxy   # HAProxy 2.4+ 권장 (req.ssl_sni 지원)
#   cp haproxy.cfg /etc/haproxy/haproxy.cfg
#   systemctl restart haproxy

global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 10s
    timeout client  60s
    timeout server  60s
    retries 2

# ─── 이그레스 릴레이 ────────────────────────────────────────────────────
frontend fe_egress_https
    bind *:443
    mode tcp

    # TLS ClientHello가 도착할 때까지 최대 5초 대기 후 SNI 검사.
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    # 화이트리스트: api.z.ai 로 가는 트래픽만 릴레이.
    # 다른 SNI 값은 default_backend(be_deny)로 떨어져 연결이 거부된다 —
    # 오픈 릴레이(임의 목적지로의 프록시 남용)를 방지하기 위한 핵심 장치.
    use_backend be_api_zai if { req.ssl_sni -i api.z.ai }

    default_backend be_deny

backend be_api_zai
    mode tcp
    # DNS resolver로 실제 api.z.ai 공인 IP를 주기적으로 재조회.
    # 프록시 노드 자신은 hosts 오버라이드를 적용하면 안 된다(실제 IP를 봐야 함).
    server zai_upstream api.z.ai:443 check inter 10s resolvers dns_pub resolve-prefer ipv4

backend be_deny
    mode tcp
    # 서버 없음 = TCP 연결 즉시 거부. 오픈 릴레이 방지.

resolvers dns_pub
    nameserver google1 8.8.8.8:53
    nameserver google2 8.8.4.4:53
    resolve_retries 3
    timeout resolve 2s
    timeout retry   1s
    hold valid 10s

# ─── 헬스체크/관측용 통계 페이지 (내부망에서만 접근 허용 권장) ───────────
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
