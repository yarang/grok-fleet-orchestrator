# examples/egress-proxy/keepalived.conf
#
# proxy-01(MASTER) / proxy-02(BACKUP) 2대 이중화.
# 두 프록시는 내부망(VCN)에서 VRRP로 서로의 상태를 감시한다.
#
# 주의: OCI는 L2 브로드캐스트를 VCN에서 막아두는 경우가 많아
#       VRRP 멀티캐스트가 동작하지 않을 수 있다. 이 경우
#       unicast_src_ip / unicast_peer 를 사용해 유니캐스트로 우회한다
#       (아래 예시가 유니캐스트 방식).
#
# 설치:
#   apt-get install keepalived
#   cp keepalived.conf /etc/keepalived/keepalived.conf   # 노드별로 state/priority 다르게
#   cp notify-failover.sh /etc/keepalived/notify-failover.sh && chmod +x $_
#   systemctl restart keepalived

vrrp_script chk_haproxy {
    script "/usr/bin/pidof haproxy"
    interval 2
    weight 2
    fall 3
    rise 2
}

vrrp_instance VI_EGRESS {
    interface ens3                      # 실제 내부망 인터페이스명으로 교체
    state MASTER                        # proxy-02 에서는 BACKUP
    virtual_router_id 51
    priority 150                        # proxy-02 에서는 100 (낮게)
    advert_int 1

    # OCI VCN은 멀티캐스트를 차단하는 경우가 많아 유니캐스트로 지정.
    unicast_src_ip 10.0.1.11            # 이 노드(proxy-01)의 사설 IP
    unicast_peer {
        10.0.1.12                       # 상대 노드(proxy-02)의 사설 IP
    }

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_SHARED_SECRET
    }

    # VIP는 내부망 전용 — 8개 워커 노드가 api.z.ai 를 이 IP로 hosts 오버라이드.
    virtual_ipaddress {
        10.0.1.100/24
    }

    track_script {
        chk_haproxy
    }

    # 승격/강등 시 OCI Reserved Public IP를 현재 MASTER로 재할당.
    # 이렇게 해야 failover 후에도 Z.ai 입장에서 보이는 공인 IP가 동일하게 유지된다.
    notify_master "/etc/keepalived/notify-failover.sh MASTER"
    notify_backup "/etc/keepalived/notify-failover.sh BACKUP"
    notify_fault  "/etc/keepalived/notify-failover.sh FAULT"
}
